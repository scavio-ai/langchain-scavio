name: Publish to PyPI

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check if version is new
        id: check
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version'])" 2>/dev/null || python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if python -c "import urllib.request,sys; urllib.request.urlopen('https://pypi.org/pypi/langchain-scavio/'+sys.argv[1]+'/json')" "$VERSION" 2>/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "langchain-scavio@$VERSION already on PyPI, skipping"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools
        if: steps.check.outputs.new == 'true'
        run: pip install build

      - name: Build package
        if: steps.check.outputs.new == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.new == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
